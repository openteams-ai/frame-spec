notes: >-
  Observed behavior, not a declaration by the implementation's maintainers.
  An investigation recorded in this repository's issue 21 found that the
  inherits field had no effect on resolution; parent content appeared only
  when the parent was activated by hand. Rule 7 requires that an
  implementation which resolves no composition declare so; this profile is
  that declaration pending confirmation. Section 5.2 also requires
  reporting the Frame Version resolved for each reference, but only for an
  implementation that resolves composition; since this one resolves none,
  that requirement does not reach it either.
