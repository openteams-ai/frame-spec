# An example conformance profile: a registry that resolves composition and
# narrows several elements. Illustrates Appendix C; it describes no real
# implementation.
implementation: Example Registry
version: "1.0"
specification: draft-mcandrew-frame-spec-00
encodings_read: [markdown]
encodings_written: [markdown]
resolves_composition: transitive
version_selection: not applicable; the only reference form it resolves is pinned-ref, and a pinned-ref always names its own version
resolver_context: the registry instance the reader is configured against; a pinned-ref's
  publisher segment names an organization within that instance, not globally
reference_forms: [pinned-ref]
rule6_narrowings:
  dedup: all-repeatable
  replace_by_key: [terminology]
non_repeatable: [toolSpecs, goals, style, norms, architecture, businessProcess]
additionally_required: [version]
identifier_minting: slugified title; reject on collision. A document read without an
  `identifier` takes the retrieval location as its identifier, per Section 6.1, which
  Section 3.2 rule 1 classes as derived and so never written back into a document
visibility: declared intent only; not an access control
notes: >-
  Cycle detection on resolution. Internal storage is YAML but is not the YAML
  encoding of the specification. Section 5.2 also requires reporting the Frame
  Version resolved for each reference. Rule 5 keeps a Frame's own composition
  list from being inherited, so the top-level reference's pinned version
  survives unresolved in the result; a profile should say whether the
  implementation also reports the version of every Frame it resolves
  transitively beneath that.
