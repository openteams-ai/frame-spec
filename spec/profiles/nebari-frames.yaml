implementation: Nebari Frames
version: 0.1.x (beta)
specification: draft-mcandrew-frame-spec-00
encodings_read: [markdown]
encodings_written: [markdown]
resolves_composition: transitive
version_selection: not applicable; the only reference form it resolves is pinned-ref, and a pinned-ref always names its own version
resolver_context: not applicable; the only reference form it resolves is pinned-ref, which carries no namespace to resolve
reference_forms: [pinned-ref]
rule6_narrowings:
  dedup: all-repeatable
  replace_by_key: [terminology]
non_repeatable: [toolSpecs, goals, style, norms, architecture, businessProcess]
additionally_required: [version]
identifier_minting: slugified title; reject on collision
visibility: declared intent only; not an access control
notes: >-
  Cycle detection on resolution. Internal storage is YAML but is not the YAML
  encoding of the specification. At the time of writing the registry still
  constrains title to an identifier syntax and rejects unrecognized headings,
  unrecognized front matter keys, and unstructured terminology entries; those
  behaviors do not conform and their removal is planned. Section 5.2 also
  requires reporting the Frame Version resolved for each reference. Rule 5
  keeps a Frame's own composition list from being inherited, so the
  top-level reference's pinned version survives unresolved in the result;
  whether the registry also reports the version of every Frame it resolves
  transitively beneath that is not confirmed here.
