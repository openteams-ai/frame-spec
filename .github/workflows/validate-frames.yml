name: Validate Frames

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Standard-library checks. Nothing to install, so this job also proves the
  # validator and its tests stay dependency-free.
  validate-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run validator tests
        run: python -m unittest discover -s tools

      - name: Validate example Frames
        run: python tools/validate_frames.py examples

  # Schema checks. These need a real YAML parser and a real JSON Schema
  # validator, which is the point: they catch what the lightweight check
  # cannot, such as YAML coercing an unquoted `version: 1.2` into a number.
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install schema tooling
        run: python -m pip install --upgrade jsonschema pyyaml

      - name: Validate schemas and example Frames against them
        run: python tools/schema_check.py examples
