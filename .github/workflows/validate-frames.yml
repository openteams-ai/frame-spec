name: Validate Frames

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run validator tests
        run: python -m unittest discover -s tools

      - name: Validate example Frames
        run: python tools/validate_frames.py examples
